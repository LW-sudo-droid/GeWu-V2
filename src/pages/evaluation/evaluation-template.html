<div class="evaluation-root"><section class="hero"><div class="wrap">
 <div class="hero-copy">
  <h1><span>共建科学评测集</span><em>服务大模型科学评测与应用</em></h1>
  <p>汇聚六大学科评测资源，展示模型在科学任务中的能力表现</p>


 </div>

</div></section>
<div class="wrap main-wrap" id="evaluation"><section class="panel">
 <div class="module-tabs" role="tablist" aria-label="评测模块"><button class="module-tab active" role="tab" aria-selected="true" id="catalogTab">评测集</button><button class="module-tab" role="tab" aria-selected="false" id="leaderboardTab">评测榜单</button></div>
 <div class="panel-body hidden" id="leaderboardPage">
  <section class="leaderboard-featured" aria-labelledby="featuredTitle">
   <div class="featured-heading">
    <h2 id="featuredTitle">榜单评测集 <span class="count" id="benchmarkCount"></span></h2>
    <label class="benchmark-search"><span data-icon="search"></span><input type="search" id="benchmarkSearch" aria-label="搜索评测集名称" placeholder="搜索评测集名称"></label>
   </div>
   <div class="benchmark-subjects" id="benchmarkSubjects" role="group" aria-label="按学科筛选评测集"></div>
   <div class="benchmark-grid" id="benchmarkGrid" role="group" aria-label="选择评测集"></div>
   <div class="benchmark-footer">
    <span id="benchmarkRange" role="status"></span>
    <nav class="benchmark-pagination" id="benchmarkPagination" aria-label="评测集分页">
     <button type="button" id="benchmarkPrev" aria-label="评测集上一页"><span data-icon="chevron-left"></span></button>
     <span id="benchmarkPage"></span>
     <button type="button" id="benchmarkNext" aria-label="评测集下一页"><span data-icon="chevron-right"></span></button>
    </nav>
   </div>
  </section>
  <div id="benchmarkPanel" role="region" aria-labelledby="benchmarkTitle">
   <section class="leaderboard-overview" aria-labelledby="benchmarkTitle">
    <div class="benchmark-summary">
     <div class="benchmark-heading"><div class="benchmark-icon" id="benchmarkIcon"></div><div>
      <div class="benchmark-title-row"><h2 id="benchmarkTitle"></h2><span class="subject-tags" id="taskTag"></span></div>
      <p class="benchmark-desc" id="benchmarkDesc"></p>
     </div></div>
     <div class="summary-actions">
      <a class="btn" id="sourceLink" target="_blank" rel="noopener noreferrer">原始来源 <span data-icon="external"></span></a>
      <button class="btn" type="button" id="detailBtn"><span data-icon="book"></span>查看详情</button>
     </div>
    </div>
    <dl class="metadata" id="metadata"></dl>
    <div class="leaderboard-protocol hidden" id="leaderboardProtocol">
     <label id="boardSelectorLabel" class="hidden">榜单口径 <select id="boardSelector" aria-label="榜单口径"></select></label>
     <span id="boardLabel" class="hidden"></span>
     <a id="boardOriginalLink" target="_blank" rel="noopener noreferrer">查看原始成绩 ↗</a>
     <details id="boardMethodology"><summary>版本与评测协议</summary><p id="boardMethodText"></p></details>
    </div>
   </section>
   <section class="leaderboard-models" aria-labelledby="modelPerformanceTitle">
    <div class="table-top"><div class="table-title"><h3 id="modelPerformanceTitle">模型表现</h3></div>
     <div class="table-actions">
      <div class="segmented" role="group" aria-label="展示方式"><button type="button" class="active" id="tableViewBtn" aria-pressed="true"><span data-icon="table"></span>榜单</button><button type="button" id="chartViewBtn" aria-pressed="false"><span data-icon="chart"></span>图表</button></div>
      <button type="button" class="btn btn-primary" id="exportBtn"><span data-icon="download"></span>导出数据</button>
     </div>
    </div>
    <div class="filter-bar">
     <div class="search-box" role="search"><span data-icon="search"></span><input type="search" id="modelSearch" placeholder="搜索模型名称或机构" aria-label="搜索模型名称或机构"><button type="button" class="clear-search hidden" id="clearSearch" aria-label="清空模型搜索"><span data-icon="close"></span></button></div>
     <div class="filter-buttons" role="group" aria-label="模型开放类型"><button type="button" class="active" data-access="all" aria-pressed="true">全部</button><button type="button" data-access="open" aria-pressed="false">开源模型</button><button type="button" data-access="closed" aria-pressed="false">闭源模型</button></div>
     <div class="filter-result"><button type="button" id="resetBtn" class="hidden">重置</button></div>
    </div>
    <div class="table-container"><div id="results"></div><div class="table-footer"><span id="resultSummary" role="status"></span><div class="pagination" id="pagination" aria-label="榜单分页"></div></div></div>
   </section>
  </div>
 </div>
 <div class="panel-body" id="catalogPage">
  <div class="catalog-search-row"><form id="catalogSearchForm" class="evaluation-catalog-search" role="search" aria-label="评测集检索">
   <span data-icon="search" aria-hidden="true"></span><input type="search" id="catalogSearch" aria-label="搜索评测集" placeholder="搜索评测集" autocomplete="off"><button type="submit">搜索</button>
  </form></div>
  <div id="catalogListView" class="catalog-layout">
   <aside class="catalog-sidebar"><div class="catalog-sidebar-head">筛选条件<button class="text-btn" id="catalogFilterReset">重置</button></div><div id="catalogFilters"></div></aside>
   <div class="catalog-content">
    <div class="catalog-toolbar"><h2>科学评测集</h2><div class="catalog-toolbar-actions"><button class="btn btn-primary" id="uploadBtn"><span data-icon="upload"></span>上传评测集</button><div id="catalogPlanTop" class="catalog-plan-top"></div></div></div>
    <div class="catalog-results-bar"><span id="catalogTotal" class="catalog-total" role="status"></span><select id="catalogSort" aria-label="评测集排序"><option value="year">最近年份</option><option value="name">名称 A - Z</option><option value="views">浏览量（从高到低）</option><option value="favorites">收藏量（从高到低）</option></select></div>
    <div id="catalogActiveRow" class="catalog-active-row hidden"><div id="catalogActiveTags" class="catalog-active-tags"></div><button class="text-btn" id="catalogClearAll">清空</button></div>
    <div class="catalog" id="catalog"></div><div class="pagination catalog-pagination" id="catalogPagination" aria-label="评测集分页"></div>
   </div>
  </div>
 </div>
</section></div>
<div id="compareTray" class="compare-tray hidden" aria-live="polite"></div><div id="catalogDrawerRoot"></div><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
</div>
