<div class="evaluation-root"><section class="hero"><div class="wrap">
 <div class="hero-copy">
  <h1><span>共建科学评测集</span><em>服务大模型科学评测与应用</em></h1>
  <p>汇聚六大学科评测资源，展示模型在科学任务中的能力表现</p>


 </div>

</div></section>
<div class="wrap main-wrap" id="evaluation"><section class="panel">
 <div class="module-tabs" role="tablist" aria-label="评测模块"><button class="module-tab active" role="tab" aria-selected="true" id="catalogTab">评测集</button><button class="module-tab" role="tab" aria-selected="false" id="leaderboardTab">评测榜单</button><div class="evaluation-module-actions"><button class="text-btn" id="coBuildBtn">查看共建说明 <span data-icon="arrow-right"></span></button></div></div>
 <div class="panel-body hidden" id="leaderboardPage">
  <div class="section-overline">精选评测集 <span class="count">10</span></div>
  <div class="benchmark-tabs" id="benchmarkTabs" role="tablist" aria-label="选择评测集"></div>
  <div class="benchmark-summary"><div class="benchmark-heading"><div class="benchmark-icon" id="benchmarkIcon"></div><div><div class="benchmark-title-row"><h2 id="benchmarkTitle"></h2><span class="subject-tags" id="taskTag"></span></div><div class="benchmark-desc" id="benchmarkDesc"></div></div></div><div class="summary-actions"><button class="text-btn" id="methodBtn"><span data-icon="book"></span>评测说明</button><a class="text-btn" id="sourceLink" target="_blank" rel="noopener noreferrer">原始来源 <span data-icon="external"></span></a><button class="text-btn" id="detailBtn">查看详情 <span data-icon="arrow-right"></span></button></div></div>
  <div class="metadata" id="metadata"></div>
  <div class="table-top"><div class="table-title"><h3>模型表现</h3></div><div class="table-actions"><div class="segmented" aria-label="展示方式"><button class="active" id="tableViewBtn" aria-pressed="true"><span data-icon="table"></span>榜单</button><button id="chartViewBtn" aria-pressed="false"><span data-icon="chart"></span>图表</button></div><button class="btn" id="exportBtn"><span data-icon="download"></span>导出数据</button></div></div>
  <div class="filter-bar"><label class="search-box"><span data-icon="search"></span><input type="search" id="modelSearch" placeholder="搜索模型名称或机构" aria-label="搜索模型名称或机构"><button class="clear-search hidden" id="clearSearch" aria-label="清除搜索">×</button></label><span class="filter-label">模型类型</span><div class="filter-buttons" role="group" aria-label="权重开放状态"><button class="active" data-access="all" aria-pressed="true">全部</button><button data-access="open" aria-pressed="false">开放权重</button><button data-access="closed" aria-pressed="false">闭源模型</button></div><div class="filter-result"><span id="filterCount" hidden></span><button id="resetBtn" class="hidden">重置</button></div></div>
  <div class="table-container"><div id="results"></div><div class="table-footer"><span id="resultSummary" hidden></span><div class="pagination" id="pagination" aria-label="榜单分页"></div></div></div>
 </div>
 <div class="panel-body" id="catalogPage">
  <div class="catalog-search-row"><form id="catalogSearchForm" class="evaluation-catalog-search" role="search" aria-label="评测集检索">
   <span data-icon="search" aria-hidden="true"></span><input type="search" id="catalogSearch" aria-label="搜索评测、任务或论文" placeholder="搜索评测、任务或论文..." autocomplete="off"><button type="submit">搜索</button>
  </form></div>
  <div id="catalogListView" class="catalog-layout">
   <aside class="catalog-sidebar"><div class="catalog-sidebar-head">筛选条件<button class="text-btn" id="catalogFilterReset">重置</button></div><div id="catalogFilters"></div></aside>
   <div class="catalog-content">
    <div class="catalog-toolbar"><h2>科学评测集</h2><div class="catalog-toolbar-actions"><button class="btn btn-primary" id="uploadBtn"><span data-icon="upload"></span>上传评测集</button><div id="catalogPlanTop" class="catalog-plan-top"></div></div></div>
    <div class="catalog-results-bar"><span id="catalogTotal" class="catalog-total" role="status"></span><select id="catalogSort" aria-label="评测集排序"><option value="year">最近年份</option><option value="name">名称 A - Z</option><option value="views">浏览量（从高到低）</option><option value="favorites">收藏量（从高到低）</option></select></div>
    <div id="catalogActiveRow" class="catalog-active-row hidden"><div id="catalogActiveTags" class="catalog-active-tags"></div><button class="text-btn" id="catalogClearAll">清空</button></div>
    <div class="catalog" id="catalog"></div><div class="pagination catalog-pagination" id="catalogPagination" aria-label="评测集分页"></div>
   </div>
  </div><div id="catalogDetailView" class="catalog-detail-view hidden"></div>
 </div>
</section></div>
<div class="wrap evaluation-detail-page hidden" id="catalogStandaloneDetail"></div>
<div id="compareTray" class="compare-tray hidden" aria-live="polite"></div><div id="catalogDrawerRoot"></div><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
</div>
